<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fried Chicken Run</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#1a0000;overflow:hidden;display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair;max-width:100vw;max-height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ── CONSTANTS ────────────────────────────────────────────────────────────────
const W = 320, H = 240, SCALE = 3;

// ── CANVAS ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
canvas.width  = W * SCALE;
canvas.height = H * SCALE;
canvas.style.width  = W * SCALE + 'px';
canvas.style.height = H * SCALE + 'px';

// ── ENEMY TYPES (internal keys unchanged; art & theme changed) ───────────────
// GRUNT   = Paper Bag     RUNNER = Meal Box
// TANK    = Family Bucket SHOOTER = Spicy Box   BOSS = The Colonel
const ET = {
  GRUNT:   {hp:2,  speed:0.65, size:5,  col:'#c49040', score:10,  w:10, shoots:false},
  RUNNER:  {hp:1,  speed:1.3,  size:4,  col:'#dd2200', score:20,  w:6,  shoots:false},
  TANK:    {hp:8,  speed:0.35, size:7,  col:'#cc1111', score:30,  w:4,  shoots:false},
  SHOOTER: {hp:3,  speed:0.4,  size:5,  col:'#e85000', score:40,  w:3,  shoots:true, fr:2200},
  BOSS:    {hp:50, speed:0.5,  size:13, col:'#cc0000', score:500, w:0,  shoots:true, fr:900 }
};

// Packaging display names used in UI
const ENAMES = {GRUNT:'BAG', RUNNER:'BOX', TANK:'BUCKET', SHOOTER:'SPICY', BOSS:'COLONEL'};

function levelCfg(lvl) {
  const boss = lvl % 3 === 0;
  const types = lvl === 1 ? ['GRUNT']
              : lvl === 2 ? ['GRUNT','RUNNER']
              :             ['GRUNT','RUNNER','TANK','SHOOTER'];
  return {
    quota:    boss ? 1 : 10 + (lvl-1)*5,
    interval: Math.max(600, 2000 - lvl*150),
    types, boss,
    shade:    (lvl-1) * 8   // 0, 8, 16 … shifts red toward orange-red
  };
}

// ── BACKGROUND — KFC restaurant floor (red + cream checker) ──────────────────
const bgC = document.createElement('canvas');
bgC.width = W; bgC.height = H;
const bgX = bgC.getContext('2d');

function buildBg(shade) {
  for (let y = 0; y < H; y += 10)
    for (let x = 0; x < W; x += 10) {
      bgX.fillStyle = ((x/10+y/10)%2===0) ? '#f2ede0' : `hsl(${shade},80%,20%)`;
      bgX.fillRect(x, y, 10, 10);
    }
}
buildBg(0);

// ── INPUT ────────────────────────────────────────────────────────────────────
const keys  = {};
const mouse = {x:W/2, y:H/2, down:false};

window.addEventListener('keydown', e => { keys[e.key]=true;  handleAction('key'); });
window.addEventListener('keyup',   e => { keys[e.key]=false; });
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / r.width  * W;
  mouse.y = (e.clientY - r.top)  / r.height * H;
});
canvas.addEventListener('mousedown', () => { mouse.down=true;  handleAction('click'); });
canvas.addEventListener('mouseup',   () => { mouse.down=false; });

function handleAction(src) {
  if (src==='key' && !keys['Enter']) return;
  if (gs==='MENU')          { startFresh(); return; }
  if (gs==='GAME_OVER')     { gs='MENU'; buildBg(0); return; }
  if (gs==='LEVEL_COMPLETE' && Date.now()-lcTime>1000) { advance(); return; }
}

// ── GAME STATE ───────────────────────────────────────────────────────────────
let gs='MENU', level, score, kills, quota, bossAlive, cfg, lcTime=0;

function startFresh() {
  level=1; score=0;
  P.hp=P.maxHp; P.x=W/2; P.y=H/2;
  P.invUntil=0; P.lastFire=Date.now();
  startLevel(); gs='PLAYING';
}

function advance() {
  P.hp = Math.min(P.maxHp, P.hp+30);
  level++;
  startLevel(); gs='PLAYING';
}

function startLevel() {
  cfg      = levelCfg(level);
  quota    = cfg.quota;
  kills    = 0;
  bossAlive= false;
  enemies.length=pBullets.length=eBullets.length=particles.length=0;
  spawnT   = cfg.interval;
  buildBg(cfg.shade);
  if (cfg.boss) { spawnEnemy('BOSS'); bossAlive=true; }
}

// ── PLAYER (fried chicken drumstick) ─────────────────────────────────────────
const P = {
  x:W/2, y:H/2, angle:0,
  hp:100, maxHp:100,
  speed:1.6, fireRate:220, lastFire:0,
  animFrame:0, animTimer:0,
  muzzle:0, invUntil:0
};

function updatePlayer(dt) {
  const now = Date.now();
  let dx=0, dy=0;
  if (keys['ArrowLeft']  || keys['a']) dx-=1;
  if (keys['ArrowRight'] || keys['d']) dx+=1;
  if (keys['ArrowUp']    || keys['w']) dy-=1;
  if (keys['ArrowDown']  || keys['s']) dy+=1;
  if (dx&&dy) { dx*=0.7071; dy*=0.7071; }
  P.x = Math.max(6, Math.min(W-6, P.x + dx*P.speed));
  P.y = Math.max(6, Math.min(H-6, P.y + dy*P.speed));
  if (dx||dy) { P.animTimer-=dt; if (P.animTimer<=0){P.animFrame^=1; P.animTimer=180;} }
  P.angle = Math.atan2(mouse.y-P.y, mouse.x-P.x);
  if (mouse.down && now-P.lastFire>=P.fireRate) {
    P.lastFire=now; P.muzzle=4;
    shoot(P.x+Math.cos(P.angle)*10, P.y+Math.sin(P.angle)*10, P.angle, 5, 1, 'p');
  }
  if (P.muzzle>0) P.muzzle--;
}

function drawPlayer() {
  const now   = Date.now();
  const flash = P.invUntil>now && Math.floor(now/80)%2===0;

  const breading = flash?'#fff':'#c8791a';
  const crust    = flash?'#ddd':'#7a3e0a';
  const crisp    = flash?'#eee':'#a05010';
  const gloss    = flash?'#fff':'#e09a30';
  const bone     = flash?'#fff':'#f5e8c8';
  const boneDark = flash?'#ddd':'#d6c8a0';

  ctx.save();
  ctx.translate(P.x, P.y);
  ctx.rotate(P.angle + Math.PI/2);

  ctx.fillStyle=boneDark; ctx.fillRect(-2,-13,4,4);
  ctx.fillStyle=bone;     ctx.fillRect(-1,-17,2,5);
  ctx.fillStyle=boneDark; ctx.fillRect(-2,-13,4,1);

  ctx.fillStyle=breading;
  ctx.fillRect(-2,-10,4,2);
  ctx.fillRect(-4, -8,8,3);
  ctx.fillRect(-5, -5,10,5);
  ctx.fillRect(-4,  0,9,4);
  ctx.fillRect(-3,  4,7,3);
  ctx.fillRect(-2,  7,5,2);

  ctx.fillStyle=crust;
  ctx.fillRect(-5,-5,1,9);
  ctx.fillRect( 4,-5,1,9);
  ctx.fillRect(-4, 8,9,1);

  ctx.fillStyle=crisp;
  ctx.fillRect(-3,-7,2,2); ctx.fillRect(2,-6,2,2);
  ctx.fillRect(-4,-1,2,2); ctx.fillRect(2, 1,2,2);
  ctx.fillRect(-2, 4,2,2); ctx.fillRect(1, 5,2,1);
  ctx.fillRect( 0,-3,2,1);

  ctx.fillStyle=gloss;
  ctx.fillRect(-2,-4,3,2);
  ctx.fillRect(-1, 1,2,2);

  if (P.muzzle>0) {
    ctx.fillStyle='#ffee00'; ctx.fillRect(-3,-20,6,4);
    ctx.fillStyle='#ff8800'; ctx.fillRect(-2,-22,4,3);
  }
  ctx.restore();
}

// ── BULLETS ──────────────────────────────────────────────────────────────────
const pBullets=[], eBullets=[];

function shoot(x,y,a,spd,dmg,who) {
  const arr = who==='p' ? pBullets : eBullets;
  arr.push({x,y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, dmg, r:who==='p'?1.5:2});
}

function updateBullets() {
  for (let i=pBullets.length-1;i>=0;i--) {
    const b=pBullets[i]; b.x+=b.vx; b.y+=b.vy;
    if (oob(b)) pBullets.splice(i,1);
  }
  for (let i=eBullets.length-1;i>=0;i--) {
    const b=eBullets[i]; b.x+=b.vx; b.y+=b.vy;
    if (oob(b)) eBullets.splice(i,1);
  }
}

function oob(b) { return b.x<-8||b.x>W+8||b.y<-8||b.y>H+8; }

function renderBullets() {
  // Player fires hot grease (golden/orange drops)
  for (const b of pBullets) {
    ctx.fillStyle='#ffe000';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,200,0,.3)';
    ctx.beginPath(); ctx.arc(b.x-b.vx*.6,b.y-b.vy*.6,b.r*.7,0,Math.PI*2); ctx.fill();
  }
  // Packaging fires sauce (brown/dark orange globs)
  for (const b of eBullets) {
    ctx.fillStyle='#aa3300';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(180,80,0,.35)';
    ctx.beginPath(); ctx.arc(b.x-b.vx*.6,b.y-b.vy*.6,b.r*.7,0,Math.PI*2); ctx.fill();
  }
}

// ── ENEMIES (packaging) ──────────────────────────────────────────────────────
const enemies=[];
let spawnT=0;

function spawnEnemy(override) {
  let type=override;
  if (!type) {
    const al=cfg.types, ws=al.map(t=>ET[t].w);
    let r=Math.random()*ws.reduce((a,b)=>a+b,0);
    for (let i=0;i<al.length;i++){r-=ws[i]; if(r<=0){type=al[i];break;}}
    type=type||al[0];
  }
  const t=ET[type];
  let x,y;
  switch(Math.floor(Math.random()*4)) {
    case 0: x=Math.random()*W; y=-t.size-2;      break;
    case 1: x=Math.random()*W; y=H+t.size+2;     break;
    case 2: x=-t.size-2;       y=Math.random()*H; break;
    default:x=W+t.size+2;      y=Math.random()*H;
  }
  enemies.push({type,x,y, hp:t.hp,maxHp:t.hp, angle:0,
    animFrame:0,animTimer:180, lastFire:0, lastHit:0, flashUntil:0});
}

function updateEnemies(dt) {
  const now=Date.now();

  if (!cfg.boss) {
    spawnT-=dt;
    if (spawnT<=0) { spawnT=cfg.interval; spawnEnemy(); }
  }

  for (let i=enemies.length-1;i>=0;i--) {
    const e=enemies[i], t=ET[e.type];
    const dx=P.x-e.x, dy=P.y-e.y;
    const dist=Math.hypot(dx,dy)||1;
    e.angle=Math.atan2(dy,dx);

    const stop=t.shoots?75:0;
    if (dist>stop) { e.x+=dx/dist*t.speed; e.y+=dy/dist*t.speed; }

    e.animTimer-=dt;
    if (e.animTimer<=0){e.animFrame^=1;e.animTimer=150;}

    if (t.shoots && dist<200 && now-e.lastFire>t.fr) {
      e.lastFire=now;
      shoot(e.x+Math.cos(e.angle)*(t.size+4), e.y+Math.sin(e.angle)*(t.size+4),
            e.angle, 2.2, 1, 'e');
    }

    if (dist<t.size+5 && now-e.lastHit>500 && P.invUntil<now) {
      e.lastHit=now; P.hp-=12; P.invUntil=now+500;
      if (P.hp<=0){gs='GAME_OVER';return;}
    }
  }

  outer:
  for (let bi=pBullets.length-1;bi>=0;bi--) {
    const b=pBullets[bi];
    for (let ei=enemies.length-1;ei>=0;ei--) {
      const e=enemies[ei], t=ET[e.type];
      if (Math.hypot(b.x-e.x,b.y-e.y)<b.r+t.size) {
        e.hp-=b.dmg; e.flashUntil=now+100;
        pBullets.splice(bi,1);
        if (e.hp<=0) {
          score+=t.score;
          burst(e.x,e.y,t.col,t.size);
          if (e.type==='BOSS') bossAlive=false;
          enemies.splice(ei,1);
          kills++;
          if (kills>=quota && !bossAlive) { lcTime=Date.now(); gs='LEVEL_COMPLETE'; return; }
        }
        continue outer;
      }
    }
  }

  for (let bi=eBullets.length-1;bi>=0;bi--) {
    const b=eBullets[bi];
    if (Math.hypot(b.x-P.x,b.y-P.y)<b.r+5 && P.invUntil<now) {
      P.hp-=12; P.invUntil=now+300; eBullets.splice(bi,1);
      if (P.hp<=0){gs='GAME_OVER';return;}
    }
  }
}

function drawEnemy(e) {
  const t=ET[e.type], now=Date.now();
  const fl=e.flashUntil>now;

  ctx.save();
  ctx.translate(e.x,e.y);
  ctx.rotate(e.angle+Math.PI/2);

  if (e.type==='GRUNT') {
    // Paper Bag — brown, folded top facing the chicken
    const b=fl?'#fff':'#c49040', bd=fl?'#bbb':'#8a5c1a', br=fl?'#ddd':'#a07030';
    const sw=e.animFrame?0:-1;            // sway
    ctx.fillStyle=b;  ctx.fillRect(-3,-4+sw,6,8);
    ctx.fillStyle=bd; ctx.fillRect(-3,-4+sw,6,3);   // folded top darker
    ctx.fillStyle=br; ctx.fillRect(-2,-4+sw,1,3); ctx.fillRect(1,-4+sw,1,3); // fold creases
    ctx.fillStyle=bd; ctx.fillRect(-4,-3+sw,1,5); ctx.fillRect(3,-3+sw,1,5); // side shadows
    if (!fl) { ctx.fillStyle='#dd0000'; ctx.fillRect(-1,-1+sw,3,2); } // red logo mark

  } else if (e.type==='RUNNER') {
    // Meal Box — slim red/white striped, open lid flaps
    const lp=e.animFrame?2:1;
    ctx.fillStyle=fl?'#fff':'#dd2200'; ctx.fillRect(-2,-5,5,9);
    ctx.fillStyle=fl?'#ddd':'#fff';    ctx.fillRect(-2,-1,5,2);  // white stripe
    ctx.fillStyle=fl?'#eee':'#bb1800'; ctx.fillRect(-3,-5,7,lp); // top lid (open/closed)
    ctx.fillStyle=fl?'#bbb':'#991100'; ctx.fillRect(-2,-5,1,9);  // left edge shadow
    if (!fl) { ctx.fillStyle='#fff'; ctx.fillRect(-1,2,2,1); }   // logo dot

  } else if (e.type==='TANK') {
    // Family Bucket — large red circle from above (round bucket opening)
    ctx.fillStyle=fl?'#fff':'#cc1111';
    ctx.fillRect(-3,-7,6,2); ctx.fillRect(-5,-5,10,2);
    ctx.fillRect(-6,-3,12,6); ctx.fillRect(-5, 3,10,2); ctx.fillRect(-3, 5,6,2);
    ctx.fillStyle=fl?'#eee':'#fff'; ctx.fillRect(-5,-1,10,2);  // white label band
    if (!fl) {
      ctx.fillStyle='#cc1111'; ctx.fillRect(-2,-1,4,2);         // logo block
      ctx.fillStyle='#fff';    ctx.fillRect(-1, 0,2,1);         // logo highlight
    }
    ctx.fillStyle=fl?'#ddd':'#ee2222'; ctx.fillRect(-6,-3,2,6); // rim highlight

  } else if (e.type==='SHOOTER') {
    // Spicy Box — orange box with animated flaps, fires sauce
    const fp=e.animFrame?1:0;
    ctx.fillStyle=fl?'#fff':'#e85000'; ctx.fillRect(-3,-5,7,9);
    ctx.fillStyle=fl?'#ddd':'#c83800'; ctx.fillRect(-3,-5,7,2); // top flap
    ctx.fillStyle=fl?'#eee':'#c83800';
    ctx.fillRect(-5,-3,2,7+fp); ctx.fillRect(4,-3,2,7-fp);     // side flaps animate
    ctx.fillStyle=fl?'#fff':'#ff9900'; ctx.fillRect(-2,1,5,2);  // orange band
    if (!fl) {
      ctx.fillStyle='#ffcc00'; ctx.fillRect(-1,-3,3,2);         // flame top
      ctx.fillStyle='#ff4400'; ctx.fillRect( 0,-4,1,2);         // flame tip
    }

  } else if (e.type==='BOSS') {
    // The Colonel — Mega Bucket, angry face, pulses
    const pulse=Math.round(Math.sin(Date.now()/180));
    const s=7+pulse;
    // Bucket body (big circle from above)
    ctx.fillStyle=fl?'#fff':'#cc0000';
    ctx.fillRect(-3,-s-2,6,2);
    ctx.fillRect(-s,-s,s*2,s*2);
    ctx.fillRect(-3, s,6,2);
    // Rim highlight
    ctx.fillStyle=fl?'#eee':'#ee2222';
    ctx.fillRect(-s,-s,2,s*2);
    // White label band
    ctx.fillStyle=fl?'#ddd':'#fff';
    ctx.fillRect(-s,-2,s*2,4);
    // The Colonel's face on the label
    if (!fl) {
      ctx.fillStyle='#000';
      ctx.fillRect(-s+3,-1,2,2);         // left eye
      ctx.fillRect( s-4,-1,2,2);         // right eye
      ctx.fillStyle='#888';
      ctx.fillRect(-s+2,-2,4,1);         // left brow
      ctx.fillRect( s-5,-2,4,1);         // right brow
      ctx.fillStyle='#555';
      ctx.fillRect(-2, 1,2,2);           // bow-tie left
      ctx.fillRect( 1, 1,2,2);           // bow-tie right
      ctx.fillStyle='#333'; ctx.fillRect(0,1,1,2); // bow-tie knot
      ctx.fillStyle='#888';
      ctx.fillRect(-s+3,-3,3,1);         // moustache L
      ctx.fillRect( s-5,-3,3,1);         // moustache R
    }
  }

  ctx.restore();
}

// ── PARTICLES ────────────────────────────────────────────────────────────────
const particles=[];

function burst(x,y,col,sz) {
  const n=Math.min(14,6+Math.floor(sz));
  for (let i=0;i<n;i++) {
    const a=Math.random()*Math.PI*2, spd=.5+Math.random()*2.5;
    particles.push({x,y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd,
      life:1, decay:.025+Math.random()*.03, col, sz:1+(Math.random()>.4?1:0)});
  }
}

function updateParticles() {
  for (let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=.9; p.vy*=.9; p.life-=p.decay;
    if (p.life<=0) particles.splice(i,1);
  }
}

function renderParticles() {
  for (const p of particles) {
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-p.sz*.5,p.y-p.sz*.5,p.sz,p.sz);
  }
  ctx.globalAlpha=1;
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function darken(h) {
  const n=parseInt(h.slice(1),16);
  return `rgb(${Math.floor(((n>>16)&255)*.55)},${Math.floor(((n>>8)&255)*.55)},${Math.floor((n&255)*.55)})`;
}

// ── HUD ──────────────────────────────────────────────────────────────────────
function renderHUD() {
  ctx.textBaseline='top'; ctx.font='6px monospace';

  // Crispiness bar (health)
  const hp=Math.max(0,P.hp/P.maxHp);
  ctx.fillStyle='#222'; ctx.fillRect(4,4,62,7);
  ctx.fillStyle=hp>.5?'#e09a30':hp>.25?'#dddd33':'#dd3333';
  ctx.fillRect(4,4,Math.floor(62*hp),7);
  ctx.strokeStyle='#666'; ctx.lineWidth=.5; ctx.strokeRect(4,4,62,7);
  ctx.fillStyle='#fff'; ctx.fillText('CRISP',4,13);

  // Score
  ctx.fillStyle='#ffee80'; ctx.textAlign='right';
  ctx.fillText('SCORE '+String(score).padStart(6,'0'), W-4, 4);

  // Wave
  ctx.fillStyle='#ffccaa'; ctx.textAlign='center';
  ctx.fillText('WAVE '+level, W/2, 4);

  // Smashed counter or Colonel bar
  ctx.textAlign='left';
  if (bossAlive) {
    ctx.fillStyle='#ffaaaa';
    ctx.fillText('THE COLONEL IS HERE!', 4, H-10);
    const boss=enemies.find(e=>e.type==='BOSS');
    if (boss) {
      const bp=boss.hp/ET.BOSS.hp;
      ctx.fillStyle='#333'; ctx.fillRect(W/2-55,H-11,110,6);
      ctx.fillStyle='#cc0000'; ctx.fillRect(W/2-55,H-11,Math.floor(110*bp),6);
      ctx.strokeStyle='#880000'; ctx.lineWidth=.5; ctx.strokeRect(W/2-55,H-11,110,6);
    }
  } else {
    ctx.fillStyle='#ffcc88';
    ctx.fillText('SMASHED '+kills+' / '+quota, 4, H-10);
  }
  ctx.textAlign='left';
}

// ── SCREENS ──────────────────────────────────────────────────────────────────
function renderMenu() {
  ctx.drawImage(bgC,0,0);
  ctx.fillStyle='rgba(10,0,0,.6)'; ctx.fillRect(0,0,W,H);

  ctx.textAlign='center'; ctx.textBaseline='middle';

  // Title
  ctx.font='bold 15px monospace';
  ctx.fillStyle='#ffdd00'; ctx.fillText('FRIED CHICKEN', W/2, 38);
  ctx.fillStyle='#ff4400'; ctx.fillText('R U N !', W/2, 56);

  // Tagline
  ctx.font='5px monospace';
  ctx.fillStyle='#cc8833';
  ctx.fillText('Stay Free.  Stay Crispy.', W/2, 70);

  // Blink prompt
  ctx.font='6px monospace';
  ctx.fillStyle=Math.floor(Date.now()/500)%2?'#fff':'#666';
  ctx.fillText('PRESS ENTER OR CLICK TO RUN', W/2, 87);

  // Controls (themed)
  ctx.font='5px monospace'; ctx.fillStyle='#886644';
  ctx.fillText('WASD / ARROWS : Strut your wings', W/2, 103);
  ctx.fillText('MOUSE : Take aim   HOLD : Spit hot grease', W/2, 113);

  // Divider
  ctx.fillStyle='#882200';
  ctx.fillText('── THEY\'RE COMING FOR YOU ──', W/2, 128);

  // Enemy showcase
  const pv=[
    {type:'GRUNT',  x:35,  lbl:'BAG'},
    {type:'RUNNER', x:83,  lbl:'BOX'},
    {type:'TANK',   x:133, lbl:'BUCKET'},
    {type:'SHOOTER',x:185, lbl:'SPICY'},
    {type:'BOSS',   x:243, lbl:'COLONEL'},
  ];
  for (const p of pv) {
    drawEnemy({type:p.type,x:p.x,y:172,angle:-Math.PI/2,animFrame:0,flashUntil:0});
    ctx.font='4px monospace'; ctx.fillStyle=ET[p.type].col;
    ctx.fillText(p.lbl, p.x, 190);
  }

  // Player preview
  const sv={x:P.x,y:P.y,angle:P.angle,muzzle:P.muzzle,invUntil:P.invUntil};
  P.x=295;P.y=172;P.angle=-Math.PI/2;P.muzzle=0;P.invUntil=0;
  drawPlayer();
  ctx.font='4px monospace'; ctx.fillStyle='#e09a30'; ctx.fillText('YOU',295,190);
  Object.assign(P,sv);

  // Bottom flavour text
  ctx.font='4px monospace'; ctx.fillStyle='#553311';
  ctx.fillText('Every wave is crispier than the last', W/2, 207);
  ctx.fillText('Wave 3, 6, 9... The Colonel himself shows up', W/2, 216);
  ctx.fillText('Take damage = lose crispiness. Don\'t get packaged!', W/2, 225);

  ctx.textAlign='left';
}

function renderLevelComplete() {
  ctx.fillStyle='rgba(10,0,0,.80)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';

  ctx.font='bold 13px monospace';
  ctx.fillStyle='#ffdd00'; ctx.fillText('STILL CRISPY!', W/2, H/2-34);

  ctx.font='7px monospace';
  ctx.fillStyle='#ffee80'; ctx.fillText('SCORE: '+String(score).padStart(6,'0'), W/2, H/2-14);
  ctx.fillStyle='#ffcc88'; ctx.fillText('MORE BOXES  —  WAVE '+(level+1), W/2, H/2+4);

  if (Date.now()-lcTime>1000) {
    ctx.font='6px monospace';
    ctx.fillStyle=Math.floor(Date.now()/400)%2?'#fff':'#666';
    ctx.fillText('PRESS ENTER OR CLICK TO KEEP RUNNING', W/2, H/2+24);
  }
  ctx.textAlign='left';
}

function renderGameOver() {
  ctx.fillStyle='#0a0000'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';

  ctx.font='bold 16px monospace';
  ctx.fillStyle=Math.floor(Date.now()/200)%2?'#ff2200':'#aa1100';
  ctx.fillText('PACKAGED UP!', W/2, 55);

  ctx.font='6px monospace'; ctx.fillStyle='#996633';
  ctx.fillText('They got you. You\'ve been boxed.', W/2, 74);

  ctx.font='7px monospace';
  ctx.fillStyle='#ffee80'; ctx.fillText('FINAL SCORE: '+String(score).padStart(6,'0'), W/2, 92);
  ctx.fillStyle='#ffcc88'; ctx.fillText('WAVE REACHED: '+level, W/2, 107);

  // Dead chicken (sideways, burnt)
  ctx.save();
  ctx.translate(W/2, 145);
  ctx.fillStyle='#7a3e0a'; ctx.fillRect(-8,-5,16,10);
  ctx.fillStyle='#c8791a'; ctx.fillRect(-7,-4,14, 8);
  ctx.fillStyle='#a05010'; ctx.fillRect(-5,-3,3,2); ctx.fillRect(2,-1,3,2); ctx.fillRect(-3,2,3,2);
  ctx.fillStyle='#e09a30'; ctx.fillRect(-4,-2,4,2);
  ctx.fillStyle='#f5e8c8'; ctx.fillRect( 7,-2,5,4);
  ctx.fillStyle='#d6c8a0'; ctx.fillRect( 7,-3,5,2);
  ctx.fillStyle='#ff2020';
  [[-3,-3],[-2,-2],[-1,-1],[0,0],[1,1],[-3,1],[-2,0],[-1,-1],[0,-2],[1,-3]].forEach(([ex,ey])=>ctx.fillRect(ex,ey,2,2));
  ctx.restore();

  ctx.font='5px monospace'; ctx.fillStyle='#996633';
  ctx.fillText('The packaging wins this time...', W/2, 170);

  ctx.font='6px monospace';
  ctx.fillStyle=Math.floor(Date.now()/500)%2?'#fff':'#555';
  ctx.fillText('PRESS ENTER OR CLICK TO ESCAPE AGAIN', W/2, 192);
  ctx.textAlign='left';
}

// ── GAME LOOP ────────────────────────────────────────────────────────────────
let lastT=0;

function loop(ts) {
  const dt=Math.min(ts-lastT, 50);
  lastT=ts;

  if (gs==='PLAYING') {
    updatePlayer(dt);
    updateEnemies(dt);
    updateBullets();
    updateParticles();
  }

  ctx.setTransform(SCALE,0,0,SCALE,0,0);
  ctx.imageSmoothingEnabled=false;

  if (gs==='MENU')           { renderMenu();     }
  else if (gs==='GAME_OVER') { renderGameOver(); }
  else {
    ctx.drawImage(bgC,0,0);
    renderParticles();
    renderBullets();
    enemies.forEach(drawEnemy);
    drawPlayer();
    renderHUD();
    if (gs==='LEVEL_COMPLETE') renderLevelComplete();
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
