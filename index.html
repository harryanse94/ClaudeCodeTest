<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harry's Games</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #1a0a00;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #eee;
  }

  h1 {
    font-size: 2.8rem;
    margin-bottom: 0.4rem;
    letter-spacing: 0.05em;
    color: #fff;
  }

  .subtitle {
    color: #888;
    font-size: 1rem;
    margin-bottom: 3rem;
  }

  .games {
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .card {
    background: #2a1200;
    border: 2px solid #4a2200;
    border-radius: 16px;
    padding: 2rem 2.5rem;
    width: 260px;
    text-align: center;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
    cursor: pointer;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: #ff6600;
    background: #3a1800;
  }

  .card .icon {
    font-size: 4rem;
    margin-bottom: 1rem;
    display: block;
  }

  .card h2 {
    font-size: 1.3rem;
    margin-bottom: 0.5rem;
    color: #ffcc88;
  }

  .card p {
    font-size: 0.85rem;
    color: #888;
    line-height: 1.5;
  }

  .tag {
    display: inline-block;
    margin-top: 1rem;
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: bold;
    letter-spacing: 0.05em;
    background: #ff6600;
    color: #fff;
  }

  .tag.blue { background: #4466ff; }
</style>
</head>
<body>

<h1>Harry's Games</h1>
<p class="subtitle">Pick a game and play</p>

<div class="games">

  <a class="card" href="shooter.html">
    <span class="icon">🍗</span>
    <h2>Fried Chicken Run</h2>
    <p>Top-down shooter. Survive waves of packaging enemies as a rogue fried chicken drumstick.</p>
    <span class="tag">Arrow keys + Mouse</span>
  </a>

  <a class="card" href="tictactoe.html">
    <span class="icon">✕</span>
    <h2>Tic Tac Toe</h2>
    <p>Classic two-player game. First to line up three in a row wins. Tracks score across rounds.</p>
    <span class="tag blue">2 Players</span>
  </a>

</div>

</body>
</html>
